function jobsPage(){let arr=db.jobs.filter(j=>[j.company,j.title,j.salary,j.location,j.memo,j.source,j.raw].join(' ').toLowerCase().includes(query.toLowerCase())&&(!filterStage||j.stage===filterStage));arr.sort((a,b)=>sort==='score'?(scores(b).value??-1)-(scores(a).value??-1):sort==='company'?(a.company||'').localeCompare(b.company||''):sort==='priority'?(Number(b.priority)||0)-(Number(a.priority)||0):(b.updated||'').localeCompare(a.updated||''));let controls='<div class="toolbar"><input id="search" placeholder="企業名・求人名・メモなどを検索" value="'+esc(query)+'" style="max-width:310px"><select id="filterStage" style="max-width:155px"><option value="">全ステータス</option>'+STAGES.map(s=>'<option value="'+s+'" '+(filterStage===s?'selected':'')+'>'+s+'</option>').join('')+'</select><select id="sort" style="max-width:165px"><option value="updated" '+(sort==='updated'?'selected':'')+'>更新順</option><option value="score" '+(sort==='score'?'selected':'')+'>AIスコア順</option><option value="priority" '+(sort==='priority'?'selected':'')+'>本人志望度順</option><option value="company" '+(sort==='company'?'selected':'')+'>企業名順</option></select><button class="btn sm" data-action="toggleView">'+(view==='table'?'▦ カード表示':'☷ テーブル表示')+'</button></div>';let content=view==='table'?'<div class="tablewrap"><table><thead><tr><th>比較</th><th>企業名・求人</th><th>年収</th><th>勤務地・勤務</th><th>選考・クイック編集</th><th>AI評価</th><th>志望度・クイック編集</th><th>次回予定・クイック編集</th><th>応募経路</th><th>URL</th><th>メモ</th></tr></thead><tbody>'+arr.map(j=>'<tr><td><input type="checkbox" class="compare-check" aria-label="比較対象に追加" data-comparecheck="'+esc(j.id)+'" '+(compareIds.includes(j.id)?'checked':'')+'></td><td><button class="linkbtn" data-detail="'+j.id+'">'+esc(j.company||'未設定')+'</button><div class="muted small">'+esc(j.title||'—')+'</div></td><td>'+esc(j.salary||'—')+'</td><td>'+esc(j.location||'—')+'<div class="muted">'+esc(j.workstyle||'')+'</div></td><td>'+quickStage(j)+'</td><td>'+scoreHtml(j)+'</td><td>'+quickPriority(j)+'</td><td>'+quickDate(j)+'</td><td>'+esc(j.source||'—')+'</td><td>'+(safeUrl(j.url)?'<a href="'+esc(j.url)+'" target="_blank" rel="noopener noreferrer">開く ↗</a>':'—')+'</td><td title="'+esc(j.memo||'')+'">'+esc((j.memo||'—').slice(0,35))+'</td></tr>').join('')+'</tbody></table></div>':'<div class="jobcards">'+arr.map(jobCard).join('')+'</div>';return header('求人データベース','求人の比較・分析・応募判断を一か所で。',addJobBtn)+compareToolbar()+controls+(arr.length?content:'<div class="empty">条件に合う求人はありません。求人登録から始めてください。</div>')}

function comparePage(){compareIds=compareIds.filter(id=>!!job(id));let selected=compareIds.map(job);let picker='<div class="card"><h3>比較対象を選択 <span class="muted small">（2〜4件）</span></h3><div class="compare-picker">'+(db.jobs.length?db.jobs.map(j=>'<label class="pick"><input type="checkbox" data-comparecheck="'+esc(j.id)+'" '+(compareIds.includes(j.id)?'checked':'')+'><span><strong>'+esc(j.company)+'</strong><small>'+esc(j.title)+'</small></span></label>').join(''):'<p class="help">求人DBから求人を登録してください。</p>')+'</div><p class="help">同じ評価ウェイトで総合点を再計算します。未評価の軸がある場合は暫定評価です。</p></div>';let content=selected.length<2?'<div class="empty">比較したい求人を2〜4件選んでください。<br>選択すると7軸の評価・年収・仕事内容・懸念点を並べて確認できます。</div>':comparisonMatrix(selected);return header('求人比較ワークスペース','複数の選択肢を同じ基準で横断比較。',addJobBtn)+compareToolbar()+picker+'<section class="section">'+content+'</section>'}
function comparisonMatrix(js){let cols=js.map(j=>'<th><div class="compare-company">'+esc(j.company)+'</div><div class="muted small">'+esc(j.title)+'</div><button class="linkbtn" data-detail="'+esc(j.id)+'">詳細を見る ↗</button></th>').join('');let row=(name,fn)=>'<tr><th scope="row">'+esc(name)+'</th>'+js.map(j=>'<td>'+fn(j)+'</td>').join('')+'</tr>';let sc=j=>{let v=scores(j);return v.value===null?'未評価':'<strong class="bigscore">'+v.value+'</strong> / 100'+(v.coverage<100?'<div class="pill amber">暫定・評価 '+v.coverage+'%</div>':'')};let html='<div class="tablewrap compare-scroll"><table class="compare-table"><thead><tr><th>比較項目</th>'+cols+'</tr></thead><tbody>'+row('総合評価',sc)+row('本人志望度',j=>esc(j.priority||'—')+' / 5')+row('年収',j=>esc(j.salary||'未登録'))+row('勤務地・勤務形態',j=>esc([j.location,j.workstyle].filter(Boolean).join(' / ')||'未登録'))+row('選考状況',j=>badge(j.stage))+row('仕事内容',j=>'<div class="compare-text">'+esc((j.raw||'未登録').slice(0,650))+(j.raw?.length>650?'…':'')+'</div>')+row('懸念点・メモ',j=>'<div class="compare-text">'+esc(j.analysis?.risks?.join('\n')||j.memo||'未登録')+'</div>');CRITERIA.forEach((c,i)=>{html+=row(c+'（'+db.weights[i]+'%）',j=>{let n=j.analysis?.scores?.[i];return n==null?'<span class="muted">未評価</span>':'<strong>'+n+'点</strong><div class="bar"><span style="width:'+n+'%"></span></div><div class="compare-text help">'+esc(j.analysis?.reasons?.[i]||'根拠未登録')+'</div>'})});return html+'</tbody></table></div>'}
function recordStage(j,previous,next){if(previous===next)return;j.stageHistory??=[];j.stageHistory.push({id:uid(),from:previous||'',to:next,at:new Date().toISOString()})}
function timelineEvents(){let events=[];db.jobs.forEach(j=>{(j.stageHistory||[]).forEach(h=>{if(h.at)events.push({at:h.at,kind:'選考更新',title:(h.from?h.from+' → ':'')+h.to,company:j.company,jobId:j.id})});if(!(j.stageHistory||[]).length&&j.updated)events.push({at:j.updated,kind:'現在の状況',title:j.stage||'気になる',company:j.company,jobId:j.id,legacy:true})});db.interviews.forEach(i=>{let j=job(i.jobId);if(j&&i.when)events.push({at:i.when,kind:'面接',title:i.round||'面接',company:j.company,jobId:j.id,description:i.people||''})});db.tasks.forEach(t=>{let j=job(t.jobId);if(t.due)events.push({at:t.due,kind:t.done?'完了タスク':'次アクション',title:t.title,company:j?.company||'共通',jobId:j?.id,description:t.done?'完了':'期限'})});return events.sort((a,b)=>b.at.localeCompare(a.at))}
function timelinePage(){let events=timelineEvents();return header('選考タイムライン','選考の変化・面接・次アクションを時系列で確認。','<button class="btn" data-page="pipeline">選考ボードを見る</button>')+'<div class="card"><div class="eyebrow">ACTIVITY HISTORY</div><h3>選考・面接・アクションの履歴</h3>'+(events.length?'<div class="timeline-list">'+events.map(e=>'<div class="timeline-event"><div class="timeline-marker"></div><div class="timeline-body"><div class="timeline-top"><span class="pill '+(e.kind==='面接'?'blue':e.kind==='次アクション'?'amber':'')+'">'+esc(e.kind)+'</span><time>'+esc(fmt(e.at))+'</time></div><div class="item-title">'+esc(e.title)+'</div><div class="item-sub">'+esc(e.company)+(e.description?' · '+esc(e.description):'')+'</div>'+(e.legacy?'<div class="help">旧データの現在状態（変更日時は不明）</div>':'')+(e.jobId?'<button class="linkbtn" data-detail="'+esc(e.jobId)+'">求人詳細を見る ↗</button>':'')+'</div></div>').join('')+'</div>':'<div class="empty">まだ履歴がありません。求人の選考状況を更新するか、面接・タスクを登録してください。</div>')+'</div>'}
function inboxPage(){return header('ChatGPTから求人を取り込む','このチャットで整理した求人データを、貼り付けるだけでまとめて登録。','<button class="btn" data-action="showFormat">入力形式を見る</button>')+'<div class="inbox-layout"><section class="card"><div class="eyebrow">QUICK IMPORT</div><h2 style="margin:6px 0 8px">求人データを一括反映</h2><p class="help">このチャットに求人票を送ると、ChatGPTが取り込み用JSONを作成できます。出力されたJSONを下に貼り付けてください。既存求人と一致する場合は重複登録せず、情報を統合します。</p><div class="field"><label for="bulkjson">ChatGPTから受け取ったJSON</label><textarea id="bulkjson" class="import-textarea" placeholder="JSONをここに貼り付けてください"></textarea></div><div class="actions"><button class="btn primary" data-action="previewBulk">内容を確認して取り込む →</button><button class="btn" data-action="pasteBulk">クリップボードから貼り付け</button></div><p class="help">安全のため自動で端末内のデータを書き換えません。確認後に取り込みます。AI評価は別途分析結果を取り込めます。</p></section><aside class="card"><div class="eyebrow">HOW IT WORKS</div><h3>3ステップで登録</h3><div class="steps"><div><b>01</b><span>このチャットに求人情報を送る</span></div><div><b>02</b><span>返ってきた取り込み用JSONをコピー</span></div><div><b>03</b><span>貼り付けて確認・保存する</span></div></div><div class="divider"></div><h3>現在のデータ</h3><div class="stat">'+db.jobs.length+'<span class="muted small"> 件の求人</span></div><p class="help">データはこのブラウザにのみ保存されます。別の端末やブラウザへの反映にはバックアップの移行が必要です。</p></aside></div>'}
function normalizeIncoming(input){let items=Array.isArray(input)?input:input&&Array.isArray(input.jobs)?input.jobs:null;if(!items||items.length===0||items.length>100)throw Error('jobs配列に1〜100件の求人を指定してください');return items.map((x,i)=>{if(!x||typeof x!=='object'||Array.isArray(x))throw Error((i+1)+'件目の形式が不正です');let allowed=['company','title','salary','location','workstyle','source','stage','priority','nextDate','url','memo','raw'];let y={};for(let k of allowed){if(x[k]!=null){if(typeof x[k]!=='string'&&typeof x[k]!=='number')throw Error((i+1)+'件目の'+k+'が不正です');y[k]=String(x[k]).trim().slice(0,k==='raw'?80000:6000)}}if(!y.company||!y.title)throw Error((i+1)+'件目は企業名と求人名が必須です');if(y.url&&!safeUrl(y.url))throw Error((i+1)+'件目のURLが不正です');if(y.stage&&!STAGES.includes(y.stage))throw Error((i+1)+'件目の選考ステータスが不正です');if(y.priority&&!['1','2','3','4','5'].includes(y.priority))throw Error((i+1)+'件目の志望度が不正です');return y})}
let pendingBulk=null;
function previewBulk(){try{let raw=$('bulkjson').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');if(raw.length>1500000)throw Error('入力が大きすぎます');pendingBulk=normalizeIncoming(JSON.parse(raw));let dup=pendingBulk.filter(x=>findExisting(x)).length;openModal('取り込み内容を確認','<div class="note">'+pendingBulk.length+'件のうち既存求人と一致する可能性があるもの：'+dup+'件。既存データの入力済み項目は原則維持し、空欄を補完します。</div><div class="preview-list">'+pendingBulk.map(x=>'<div class="item"><div class="item-main"><div class="item-title">'+esc(x.company)+'</div><div class="item-sub">'+esc(x.title)+' · '+esc(x.salary||'年収未入力')+'</div></div>'+(findExisting(x)?'<span class="pill amber">既存情報に統合</span>':'<span class="pill green">新規登録</span>')+'</div>').join('')+'</div>','<button class="btn" data-action="close">キャンセル</button><button class="btn primary" data-action="commitBulk">'+pendingBulk.length+'件を取り込む</button>')}catch(e){alert('取り込み形式を確認してください：'+e.message)}}
function findExisting(x){return db.jobs.find(j=>(x.url&&j.url&&x.url===j.url)||(j.company.trim().toLowerCase()===x.company.trim().toLowerCase()&&j.title.trim().toLowerCase()===x.title.trim().toLowerCase()))}
function commitBulk(){if(!pendingBulk)return;let snapshot=JSON.stringify(db),added=0,merged=0;for(let x of pendingBulk){let old=findExisting(x);if(old){for(let k of Object.keys(x))if(!old[k])old[k]=x[k];old.updated=new Date().toISOString();merged++}else{let j={id:uid(),created:new Date().toISOString(),updated:new Date().toISOString(),stage:'気になる',priority:'',...x};db.jobs.unshift(j);if(j.stage!=='気になる')proposeTask(j);added++}}if(!save()){db=JSON.parse(snapshot);return}pendingBulk=null;close();page='jobs';render();toast('新規'+added+'件・統合'+merged+'件を反映しました')}

render=function(){studioBaseRender();let icons=['home','jobs','pipeline','tasks','more'];document.querySelectorAll('#nav .nav').forEach((b,i)=>{let k=icons[i];if(!k)return;let label=b.textContent.replace(/^[^\p{L}\p{N}]+/u,'').trim();b.innerHTML=studioIcon(k)+'<span>'+esc(label)+'</span>'});if(!document.querySelector('.sidebar-foot'))document.querySelector('.sidebar')?.insertAdjacentHTML('beforeend','<div class="sidebar-foot"><strong><span class="signal"></span>Personal workspace</strong>データはこのブラウザに保存されます</div>')};
const studioOriginalHome=homePage;
homePage=function(){
 let open=db.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));

 let recent=[...db.jobs].sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).slice(0,4);
 let visual='<svg viewBox="0 0 440 320" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M470 11C245-42 174 84 251 153s206-18 150-92S175 43 144 170 238 324 383 240"/><path d="M487 43C282-20 202 105 273 170s181-18 128-85S203 64 178 177 251 296 380 242"/><path d="M503 76C319 15 231 128 294 188s158-17 108-80S229 92 213 184 267 270 377 242"/><path d="M522 105C359 52 264 151 316 203s137-14 88-75S264 120 247 195 285 253 375 242"/><circle cx="371" cy="244" r="4"/></svg>';
 let metrics=[['登録した求人',db.jobs.length,'jobs','↗'],['選考が進行中',active.length,'pipeline','↗'],['対応するタスク',open.length,'tasks','↗'],['予定している面接',upcoming.length,'interview','↗']].map(([name,count,to,sym])=>'<div class="studio-metric" role="button" tabindex="0" data-page="'+to+'"><div class="metric-top"><span>'+name+'</span><span class="metric-symbol">'+sym+'</span></div><div class="metric-value">'+count+'</div></div>').join('');
 let taskList=open.length?open.slice(0,5).map(t=>taskRow(t)).join(''):'<div class="studio-empty"><div class="studio-empty-mark">✓</div>対応が必要なタスクはありません。<br>次の機会を探しましょう。</div>';
 let interviewList=upcoming.length?upcoming.slice(0,3).map(i=>'<div class="studio-job" data-detail="'+esc(i.jobId)+'"><div class="studio-job-initial">◷</div><div class="studio-job-body"><strong>'+esc(job(i.jobId)?.company||'企業未設定')+'</strong><small>'+esc(i.round||'面接')+' · '+fmt(i.when)+'</small></div><span>↗</span></div>').join(''):'<div class="studio-empty" style="padding:18px 0">直近の面接予定はありません。</div>';
 let jobList=(ranked.length?ranked:recent).map(j=>'<div class="studio-job" data-detail="'+esc(j.id)+'"><div class="studio-job-initial">'+esc((j.company||'—').slice(0,1))+'</div><div class="studio-job-body"><strong>'+esc(j.company||'企業名未設定')+'</strong><small>'+esc(j.title||'職種未設定')+'</small></div><span class="studio-job-score">'+(scores(j).value===null?'→':scores(j).value+'<small style="font-size:10px"> /100</small>')+'</span></div>').join('');
 return '<div class="studio-hero"><div class="hero-content"><div class="studio-eyebrow">YOUR NEXT CHAPTER</div><h1>次のキャリアを、<br>確かな選択に。</h1><p>求人を集める。比較する。意思決定する。<br>あなたの可能性を、一つの場所で整理しましょう。</p><button class="hero-button" data-action="addJob">求人を追加する <span>↗</span></button></div><div class="hero-art">'+visual+'</div></div>'+
 '<div class="studio-toolbar"><h2>活動の現在地</h2><span class="meta">OVERVIEW</span></div><div class="studio-metrics">'+metrics+'</div>'+
 '<div class="studio-panels"><section class="studio-panel"><div class="studio-panel-head"><h2>次にやること</h2><button class="linkbtn" data-page="tasks">すべて見る ↗</button></div>'+taskList+'<div class="studio-footerline"><span>一つずつ、着実に。</span><span>TO DO</span></div></section><section class="studio-panel"><div class="studio-panel-head"><h2>面接の予定</h2><button class="linkbtn" data-page="interview">面接管理 ↗</button></div>'+interviewList+'<button class="studio-shortcut" data-page="pipeline">選考状況を確認する <span>↗</span></button><div class="studio-footerline"><span>面接・応募の進捗を一元管理</span><span>PIPELINE</span></div></section></div>'+
 '<div class="studio-toolbar"><h2>'+(ranked.length?'注目している求人':'最近登録した求人')+'</h2><button class="linkbtn" data-page="jobs">求人一覧を見る ↗</button></div><div class="studio-list">'+(jobList||'<div class="studio-panel studio-empty"><div class="studio-empty-mark">＋</div>求人を登録すると、ここに表示されます。</div>')+'</div>';
};
// Keyboard access for metric tiles, without affecting existing delegated click handling.
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.studio-metric')){e.preventDefault();e.target.click()}});

render();

document.addEventListener('input',e=>{let el=e.target;if(el.id==='captureRaw'){clearTimeout(captureTimer);$('captureStatus').textContent='解析中…';captureTimer=setTimeout(captureUpdate,180)}else if(el.id?.startsWith('cap')&&el.id!=='capDuplicateMode'){captureDuplicateUpdate();captureMissingUpdate()}},true);

/* Cloud edition: authentication layer, deliberately isolated from the workspace */

.arc-login{width:min(100%,460px);padding:45px 38px;background:#fff;border:1px solid #e5e9df;border-radius:26px;box-shadow:0 25px 75px #1b3c2714}

.arc-login label{display:block;font-size:12px;font-weight:700;margin:14px 0 7px;color:#354a3b}.arc-login input{width:100%;border:1px solid #cbd7ca;border-radius:10px;padding:13px 12px;font-size:14px;background:#fbfcfa;color:#1e3627}
.arc-login button.arc-primary{width:100%;border:0;border-radius:12px;background:#204a34;color:#fff;padding:15px 16px;font-weight:750;font-size:14px;cursor:pointer;margin-top:18px}
.arc-login button.arc-secondary{width:100%;border:1px solid #d7e1d7;border-radius:12px;background:#fff;color:#254533;padding:12px 14px;font-weight:700;cursor:pointer;margin-top:10px}
.arc-login .arc-hint{font-size:12px;color:#7c887e;margin-top:18px;line-height:1.7}.arc-login .arc-error{color:#ae403b;font-size:13px;margin-top:14px;white-space:pre-wrap}
.arc-login .arc-options{display:grid;gap:8px;margin-top:18px}.arc-login .arc-options button{border:1px solid #dae5d9;background:#f8faf6;text-align:left;padding:15px;border-radius:12px;cursor:pointer;color:#21432e}.arc-login .arc-options button strong{display:block;margin-bottom:4px}.arc-login .arc-options button span{font-size:12px;color:#647466}
@media(max-width:650px){#arc-cloud-bar{top:auto;bottom:14px;right:12px;left:12px;justify-content:center}.arc-login{padding:28px 22px}}
</style>
<div id="arc-cloud-bar" hidden><span id="arc-cloud-dot"></span><span id="arc-cloud-state">未接続</span><button id="arc-cloud-retry" hidden>再試行</button><button id="arc-cloud-signout" title="ログアウト">ログアウト</button></div>
<div id="arc-cloud-gate"><div class="arc-login" id="arc-cloud-card"><div class="arc-brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M35 11A20 20 0 1 0 35 37 M31 17A12 12 0 1 0 31 31"/><circle cx="37" cy="24" r="3" fill="#346b49" stroke="none"/></svg>arc.</div><h1>キャリアの可能性を、ひとつに。</h1><p>Googleでログインして、どの端末からも同じワークスペースへ。</p><div id="arc-cloud-content"></div><div class="arc-error" id="arc-cloud-error" role="alert"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{
'use strict';
const SETTINGS='arc-cloud-config-v1', LOCAL_KEY='career-command-center-v1';
const gate=document.getElementById('arc-cloud-gate'),content=document.getElementById('arc-cloud-content'),err=document.getElementById('arc-cloud-error');
const bar=document.getElementById('arc-cloud-bar'),dot=document.getElementById('arc-cloud-dot'),state=document.getElementById('arc-cloud-state'),retry=document.getElementById('arc-cloud-retry');
let client=null,user=null,revision=null,dirty=false,sending=false,timer=null,ready=false,paused=false,lastLocal='',poll=null;
const h=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=(message,kind='')=>{state.textContent=message;dot.className=kind;bar.hidden=!user;retry.hidden=kind!=='error'};
const showError=e=>{err.textContent=typeof e==='string'?e:(e?.message||'エラーが発生しました。')};
const snapshot=()=>JSON.stringify(db);
const localPresent=()=>{try{const d=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');return d&&((d.jobs?.length||0)+(d.tasks?.length||0)+(d.interviews?.length||0)+(d.stories?.length||0)>0)}catch{return false}};
const validate=d=>d&&Array.isArray(d.jobs)&&Array.isArray(d.tasks)&&Array.isArray(d.weights)&&d.weights.length===7;
const downloadBackup=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([snapshot()],{type:'application/json'}));a.download='arc-backup-before-cloud-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const apply=d=>{if(!validate(d))throw Error('クラウドのデータ形式が不正です。');db=d;db.interviews??=[];db.stories??=[];localStorage.setItem(LOCAL_KEY,snapshot());lastLocal=snapshot();render()};
const showLogin=()=>{ready=false;gate.hidden=false;bar.hidden=true;const cfg=JSON.parse(localStorage.getItem(SETTINGS)||'null');if(!cfg?.url||!cfg?.key){content.innerHTML='<label>Supabase Project URL</label><input id="arc-url" placeholder="https://xxxxx.supabase.co" autocomplete="off"><label>Supabase Publishable / anon key</label><input id="arc-key" placeholder="sb_publishable_... または eyJ..." autocomplete="off"><button class="arc-primary" id="arc-config-save">接続設定を保存</button><div class="arc-hint">公開用キーのみを入力してください。service_role / secret key は絶対に入力しないでください。設定はこのブラウザに保存されます。</div>';return}content.innerHTML='<button class="arc-primary" id="arc-login">Googleでログイン</button><button class="arc-secondary" id="arc-config-edit">接続設定を変更</button><div class="arc-hint">このアプリは設定済みのSupabaseプロジェクトに接続します。初回はGoogle認証の設定が必要です。</div>'};
async function connect(){const cfg=JSON.parse(localStorage.getItem(SETTINGS)||'null');if(!cfg?.url||!cfg?.key){showLogin();return}if(!window.supabase?.createClient){showError('認証ライブラリを読み込めません。ネット接続や広告ブロッカーを確認してください。');showLogin();return}client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;showLogin();return}if(session?.user&&!ready&&!paused){user=session.user;setTimeout(()=>start(),0)}});const {data,error}=await client.auth.getSession();if(error){showError(error);showLogin();return}if(data.session?.user){user=data.session.user;await start()}else showLogin()}
async function getRemote(){const {data,error}=await client.from('arc_workspaces').select('payload,revision').eq('user_id',user.id).maybeSingle();if(error)throw error;return data}
async function start(){if(ready||paused||!user)return;gate.hidden=false;content.innerHTML='<p>ワークスペースを読み込んでいます…</p>';try{const remote=await getRemote();if(!remote){revision=null;if(localPresent()){migration('empty');return}await insertInitial();}else{revision=remote.revision;if(localPresent()&&!localStorage.getItem('arc-migrated-'+user.id)){migration('existing',remote);return}apply(remote.payload)}unlock();}catch(e){showError('クラウドへの接続に失敗しました。\n'+e.message);content.innerHTML='<button class="arc-primary" id="arc-reconnect">再試行</button><button class="arc-secondary" id="arc-config-edit">接続設定を変更</button>'}}
function migration(type,remote){paused=true;content.innerHTML='<h1>既存データを引き継ぎますか？</h1><p>'+ (type==='existing'?'このブラウザとクラウドの両方にデータがあります。どちらを使うか選んでください。':'このブラウザに以前の求人・選考データがあります。クラウドへ移行できます。')+'</p><button class="arc-secondary" id="arc-backup">先にJSONバックアップを保存</button><div class="arc-options"><button id="arc-use-local"><strong>この端末のデータをクラウドへ移す</strong><span>この端末の内容を採用します。既存のクラウドデータがある場合は置き換えます。</span></button>'+(type==='existing'?'<button id="arc-use-cloud"><strong>クラウドのデータを使う</strong><span>クラウド側を採用します。端末側の未同期データは上書きされます。</span></button>':'')+'</div>';window.arcCloud.pendingRemote=remote||null}
async function insertInitial(){const {data,error}=await client.from('arc_workspaces').insert({user_id:user.id,payload:db,revision:1}).select('revision').single();if(error)throw error;revision=data.revision;lastLocal=snapshot()}
function unlock(){paused=false;ready=true;dirty=false;gate.hidden=true;bar.hidden=false;localStorage.setItem('arc-migrated-'+user.id,'yes');status('すべて同期済み','ok');lastLocal=snapshot();clearInterval(poll);poll=setInterval(checkRemote,12000)}
async function checkRemote(){if(!ready||dirty||sending||document.hidden||!navigator.onLine)return;try{const r=await getRemote();if(r&&r.revision!==revision){apply(r.payload);revision=r.revision;status('別の端末の変更を反映しました','ok')}}catch(e){status('接続を確認してください','error')}}
async function flush(){if(!ready||paused||!dirty||sending||!user)return;sending=true;status('保存中…','wait');const payload=JSON.parse(snapshot()),base=revision;try{if(base===null){await insertInitial()}else{const {data,error}=await client.from('arc_workspaces').update({payload,revision:base+1,updated_at:new Date().toISOString()}).eq('user_id',user.id).eq('revision',base).select('revision');if(error)throw error;if(!data?.length){paused=true;status('他の端末と変更が競合しています','error');retry.hidden=false;showConflict();return}revision=data[0].revision}dirty=snapshot()!==JSON.stringify(payload);status(dirty?'保存待ち':'すべて同期済み',dirty?'wait':'ok');if(dirty)schedule()}catch(e){dirty=true;status('同期できませんでした。再試行してください','error');console.error('arc cloud sync',e)}finally{sending=false}}
function showConflict(){gate.hidden=false;content.innerHTML='<h1>別の端末で更新されています</h1><p>この端末の変更とクラウド側の変更が競合しています。データを失わないよう、先にバックアップを保存してください。</p><button class="arc-secondary" id="arc-backup">この端末のデータをバックアップ</button><div class="arc-options"><button id="arc-conflict-cloud"><strong>クラウドの内容を読み込む</strong><span>この端末の未同期の変更は上書きされます。</span></button><button id="arc-conflict-local"><strong>この端末の内容で上書きする</strong><span>他の端末で行った変更が失われる可能性があります。</span></button></div>'}
function schedule(){if(!ready||paused)return;dirty=true;status('保存待ち','wait');clearTimeout(timer);timer=setTimeout(flush,600)}
window.arcCloud={schedule,pendingRemote:null};
document.addEventListener('click',async e=>{const id=e.target?.id;if(!id?.startsWith('arc-'))return;try{if(id==='arc-config-save'){const url=document.getElementById('arc-url').value.trim().replace(/\/$/,'');const key=document.getElementById('arc-key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key||key.startsWith('sb_secret_'))throw Error('Project URLと公開用キーを確認してください。');localStorage.setItem(SETTINGS,JSON.stringify({url,key}));location.reload()}if(id==='arc-config-edit'){localStorage.removeItem(SETTINGS);location.reload()}if(id==='arc-login'){const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)throw error}if(id==='arc-reconnect'){paused=false;await start()}if(id==='arc-backup')downloadBackup();if(id==='arc-use-local'){if(window.arcCloud.pendingRemote&&!confirm('クラウド側のデータを置き換えます。続けますか？'))return;paused=false;const r=window.arcCloud.pendingRemote;if(r){const {data,error}=await client.from('arc_workspaces').update({payload:db,revision:r.revision+1}).eq('user_id',user.id).eq('revision',r.revision).select('revision');if(error||!data?.length)throw Error('移行中にデータが更新されました。再読込してください。');revision=data[0].revision}else await insertInitial();unlock()}if(id==='arc-use-cloud'){const r=window.arcCloud.pendingRemote;if(!r)return;if(!confirm('端末側のデータをクラウド側で置き換えますか？'))return;apply(r.payload);revision=r.revision;unlock()}if(id==='arc-conflict-cloud'){const r=await getRemote();if(!r)throw Error('クラウドデータが見つかりません');apply(r.payload);revision=r.revision;unlock()}if(id==='arc-conflict-local'){if(!confirm('クラウド側の変更を上書きします。よろしいですか？'))return;const r=await getRemote();if(!r)throw Error('クラウドデータが見つかりません');const {data,error}=await client.from('arc_workspaces').update({payload:db,revision:r.revision+1}).eq('user_id',user.id).eq('revision',r.revision).select('revision');if(error||!data?.length)throw Error('更新が競合しました。再試行してください');revision=data[0].revision;unlock()}if(id==='arc-cloud-retry'){paused=false;dirty=true;await flush()}if(id==='arc-cloud-signout'){if(dirty){await flush();if(dirty){alert('未同期の変更があります。同期後にログアウトしてください。');return}}await client.auth.signOut();localStorage.removeItem(LOCAL_KEY);location.reload()}}catch(ex){showError(ex)}});
window.addEventListener('online',()=>{if(dirty)flush();else checkRemote()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready){if(dirty)flush();else checkRemote()}});
showLogin();connect();
})();
</script></body></html>
